[package]
name = "pi-switch-native"
version = "0.2.5"
description = "Native core and terminal UI for pi-switch"
edition = "2021"

[lib]
path = "src-rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
dirs = "6"
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "system-proxy"] }
semver = "1"
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
