name: CI

env:
  APP_NAME: pi-switch-native
  MACOSX_DEPLOYMENT_TARGET: '10.13'

on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --lib

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
            cross-flags: ''
          - host: macos-latest
            target: aarch64-apple-darwin
            cross-flags: ''
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross-flags: ''  # native target on x86_64 runner, no cross toolchain needed
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross-flags: -x
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            cross-flags: ''
    name: build - ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Setup zig
        if: contains(matrix.target, 'musl')
        run: |
          curl -sSLo /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          mkdir -p /tmp/zig
          tar -xf /tmp/zig.tar.xz --strip-components=1 -C /tmp/zig
          echo /tmp/zig >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx napi build --platform --release --dts native.d.ts --target ${{ matrix.target }} ${{ matrix.cross-flags }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error
      - name: Smoke test (native target)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-apple-darwin'
        run: node -e "const b = require('./${{ env.APP_NAME }}.cjs'); if (typeof b.version !== 'function') throw new Error('binding broken'); console.log('ok', b.version());"
        shell: bash

  publish:
    name: Publish
    needs:
      - check
      - build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Gather .node files
        run: |
          find artifacts -name '${{ env.APP_NAME }}.*.node' -exec mv {} . \;
          ls -la ${{ env.APP_NAME }}.*.node
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "package: $PKG_VERSION, tag: $TAG_VERSION"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "version mismatch"; exit 1; }
      - name: Publish
        run: |
          npm config set provenance true
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
